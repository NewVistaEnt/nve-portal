<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>New Vista Team</title>
<link rel="icon" href="assets/logo/nv-mark.svg">
<link rel="stylesheet" href="assets/brand.css">
<style>
.hub{padding-block:28px 60px}
.hub h1{font-size:clamp(26px,5vw,34px)}
.hub > p{color:var(--dim);margin-top:6px}
.tiles{display:grid;gap:12px;margin-top:22px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile{display:flex;flex-direction:column;gap:6px;padding:20px;text-decoration:none;color:inherit;border-radius:16px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.tile:hover{border-color:var(--blossom-fill)}
.tile b{font-size:18px}
.tile span{color:var(--dim);font-size:14px}
.tile .lab{margin-bottom:4px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><img src="assets/logo/nv-horizontal-reverse.svg" alt="New Vista Enterprises"><span class="ttl">Team</span></div></header>
<main class="wrap hub">
  <h1>New Vista team tools</h1>
  <p>Bookmark this page, or add it to your phone's home screen.</p>
  <div class="tiles">
    <a class="tile" href="lead/"><span class="lab">Everyone</span><b>New lead</b><span>Send a new lead to Jana for Aspire.</span></a>
    <a class="tile" href="post/"><span class="lab">Project teams</span><b>Post an update</b><span>Notes and photos for a client's project page.</span></a>
    <a class="tile" href="admin/"><span class="lab">Admins</span><b>Admin</b><span>New leads, client portals, team and settings.</span></a>
  </div>
</main>
</body>
</html>
